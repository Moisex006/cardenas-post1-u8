spring.application.name=catalogo

# Conexión a MySQL
# allowPublicKeyRetrieval=true: MySQL 8 autentica con caching_sha2_password y,
# sin SSL, el driver necesita pedir la clave pública del servidor para conectarse
spring.datasource.url=jdbc:mysql://localhost:3306/catalogo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# Credenciales tomadas de variables de entorno (DB_USERNAME / DB_PASSWORD) para no
# fijar la contraseña en el código; los valores por defecto son los del laboratorio
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:apppass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Puerto del servidor
server.port=8080
