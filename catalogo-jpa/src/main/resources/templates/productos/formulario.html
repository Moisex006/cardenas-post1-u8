<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><title th:text="${titulo}">Producto</title></head>
<body>
  <h1 th:text="${titulo}"></h1>
  <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
    <input type="hidden" th:field="*{id}" />
    <p th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
    <div>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" th:field="*{nombre}" />
      <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
    </div>
    <div>
      <label for="precio">Precio:</label>
      <input type="number" id="precio" th:field="*{precio}" step="0.01" />
      <span th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span>
    </div>
    <div>
      <label for="stock">Stock:</label>
      <input type="number" id="stock" th:field="*{stock}" />
      <span th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>
    </div>
    <div>
      <label for="categoriaId">Categoría:</label>
      <!-- Se envía solo el id; ProductoService carga la Categoria y asigna la relación -->
      <select id="categoriaId" name="categoriaId" required>
        <option value="">-- Seleccione --</option>
        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                th:selected="${c.id == categoriaId}"></option>
      </select>
    </div>
    <button type="submit">Guardar</button>
    <a th:href="@{/productos}">Cancelar</a>
  </form>
</body>
</html>
