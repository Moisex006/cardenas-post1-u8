<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><title th:text="${titulo}">Formulario</title></head>
<body>
  <h1 th:text="${titulo}"></h1>
  <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post">
    <input type="hidden" th:field="*{id}" />
    <div>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" th:field="*{nombre}" />
      <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
    </div>
    <div>
      <label for="descripcion">Descripción:</label>
      <textarea id="descripcion" th:field="*{descripcion}"></textarea>
      <span th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span>
    </div>
    <button type="submit">Guardar</button>
    <a th:href="@{/categorias}">Cancelar</a>
  </form>
</body>
</html>
